services:
  postgres:
    image: postgres:17-alpine
    container_name: buddy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddy}
      POSTGRES_DB: ${POSTGRES_DB:-buddy}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-buddy} -d ${POSTGRES_DB:-buddy}
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: buddy-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        WITH_PLAYBOOK: ${ML_WITH_PLAYBOOK:-1}
        WITH_DENSE: ${ML_WITH_DENSE:-0}

    container_name: buddy-ml
    restart: unless-stopped

    environment:
      ML_PORT: "8090"
      ML_RETRIEVER: ${ML_RETRIEVER:-bm25}
      # LLM-режим агента (OpenAI-совместимый API). Без ключа работает локальный режим.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}

    ports:
      - "${ML_PORT:-8090}:8090"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: buddy-backend
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-buddy}:${POSTGRES_PASSWORD:-buddy}@postgres:5432/${POSTGRES_DB:-buddy}?sslmode=disable
      REDIS_ADDR: redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_URL: ${MCP_URL:-}
      MCP_TIMEOUT: ${MCP_TIMEOUT:-10s}
      # ML-сервис агента: POST /v1/agent/turn (contracts/ml-api.yaml)
      ML_SERVICE_URL: http://ml:8090
      ML_TIMEOUT: ${ML_TIMEOUT:-35s}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: buddy-frontend
    restart: unless-stopped

    environment:
      VITE_API_PROXY_TARGET: http://backend:8080

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
