[project]
name = "buddy-ml"
version = "1.0.0"
description = "AI-buddy ML service: ACL-aware RAG, NLU, guardrails and access-request agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# Прикладной код ML-сервиса и скрипты подготовки данных/оценки; тесты и зависимости исключены.
source = ["buddy_ml", "scripts"]
omit = ["tests/*"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"
